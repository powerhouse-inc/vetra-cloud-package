
name: Publish

on:
  # Auto-publish on push to release branches (skip bot version-bump commits)
  push:
    branches:
      - dev
      - staging
      - main

  # Manual trigger
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - dev
          - staging
          - latest
        default: 'dev'
      dry-run:
        description: 'Dry run (skip publishing)'
        required: false
        type: boolean
        default: false
      skip-docker:
        description: 'Skip Docker build and push'
        required: false
        type: boolean
        default: false

# Serialize releases per ref. Two pushes landing seconds apart both bumped the
# version and raced on `git push`; the loser died with a non-fast-forward.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'
  DOCKER_REGISTRY: cr.vetra.io
  GHCR_REGISTRY: ghcr.io

jobs:
  # ==========================================================================
  # Determine release parameters
  # ==========================================================================
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    # Skip the bot's own version-bump push to prevent infinite loops. The
    # `[skip ci]` opt-out is checked against the commit SUBJECT in the step
    # below -- `contains()` over the full message matches the squashed bodies
    # of any PR that carries a bot bump commit, which silently skipped the
    # release for that merge.
    if: "github.actor != 'github-actions[bot]'"
    outputs:
      skip_release: ${{ steps.params.outputs.skip_release }}
      channel: ${{ steps.params.outputs.channel }}
      branch: ${{ steps.params.outputs.branch }}
      project_name: ${{ steps.params.outputs.project_name }}
      dry_run: ${{ steps.params.outputs.dry_run }}
      skip_docker: ${{ steps.params.outputs.skip_docker }}
    steps:
      - name: Determine parameters
        id: params
        env:
          # Via env, not inline interpolation: the message is untrusted,
          # multi-line text.
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          EVENT_NAME="${{ github.event_name }}"

          # Honour [skip ci] only on the subject line of the pushed commit.
          SKIP_RELEASE="false"
          if [ "$EVENT_NAME" = "push" ]; then
            SUBJECT=$(printf '%s\n' "$HEAD_COMMIT_MESSAGE" | head -1)
            case "$SUBJECT" in
              *"[skip ci]"*) SKIP_RELEASE="true" ;;
            esac
          fi
          echo "skip_release=$SKIP_RELEASE" >> $GITHUB_OUTPUT

          if [ "$EVENT_NAME" = "push" ]; then
            BRANCH_NAME="${GITHUB_REF#refs/heads/}"
            case "$BRANCH_NAME" in
              dev) CHANNEL="dev" ;;
              staging) CHANNEL="staging" ;;
              main) CHANNEL="latest" ;;
              *) CHANNEL="dev" ;;
            esac
            DRY_RUN="false"
            SKIP_DOCKER="true"
          else
            CHANNEL="${{ inputs.channel }}"
            DRY_RUN="${{ inputs.dry-run }}"
            SKIP_DOCKER="${{ inputs.skip-docker }}"
          fi

          # Determine branch from channel
          case "$CHANNEL" in
            dev) BRANCH="dev" ;;
            staging) BRANCH="staging" ;;
            latest|main) BRANCH="main" ;;
            *) BRANCH="dev" ;;
          esac

          # Use DOCKER_PROJECT secret if set, otherwise extract from repository name
          if [ -n "${{ secrets.DOCKER_PROJECT }}" ]; then
            PROJECT_NAME="${{ secrets.DOCKER_PROJECT }}"
          else
            PROJECT_NAME="${GITHUB_REPOSITORY#*/}"
          fi

          echo "channel=$CHANNEL" >> $GITHUB_OUTPUT
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT
          echo "project_name=$PROJECT_NAME" >> $GITHUB_OUTPUT
          echo "dry_run=$DRY_RUN" >> $GITHUB_OUTPUT
          echo "skip_docker=$SKIP_DOCKER" >> $GITHUB_OUTPUT

          echo "Channel: $CHANNEL | Branch: $BRANCH | Dry Run: $DRY_RUN | Skip Docker: $SKIP_DOCKER"

  # ==========================================================================
  # Build and publish to npm
  # ==========================================================================
  publish:
    name: Publish NPM
    needs: prepare
    if: needs.prepare.outputs.skip_release != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: pnpm install

      - name: Build package
        run: pnpm exec ph-cli build

      - name: Run tests
        run: pnpm test || true
        continue-on-error: true

      - name: Bump version
        id: version
        run: |
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          CURRENT_VERSION=$(node -p "require('./package.json').version")

          if [ "$CHANNEL" = "latest" ]; then
            npm version patch --no-git-tag-version
          else
            npm version prerelease --preid=$CHANNEL --no-git-tag-version
          fi

          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "Bumped: $CURRENT_VERSION -> $NEW_VERSION"

      - name: Commit and push version bump
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          git add package.json pnpm-lock.yaml
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]" || echo "No changes to commit"
          git push

      - name: Build and pack
        if: needs.prepare.outputs.dry_run != 'true'
        id: pack
        run: |
          # Rebuild after the version bump (what prepublishOnly did), then pack
          # once: every registry gets the byte-identical tarball.
          pnpm run build
          TARBALL=$(npm pack --ignore-scripts --silent | tail -1)
          echo "tarball=$TARBALL" >> $GITHUB_OUTPUT
          echo "Packed $TARBALL ($(sha1sum "$TARBALL" | cut -c1-40))"

      - name: Publish to Vetra registries
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          # CI identity: a Renown key whose DID is delegated by RENOWN_ADDRESS and
          # is an owner of this package on both registries. Tokens are minted per
          # run (10 min, audience-bound), so nothing here expires.
          PH_RENOWN_PRIVATE_KEY: ${{ secrets.VETRA_REGISTRY_RENOWN_KEY }}
          RENOWN_ADDRESS: ${{ secrets.VETRA_REGISTRY_RENOWN_ADDRESS }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          set -euo pipefail
          for s in PH_RENOWN_PRIVATE_KEY RENOWN_ADDRESS; do
            [ -n "${!s}" ] || { echo "::error::secret for $s is not set"; exit 1; }
          done
          # Every channel goes to the dev registry (testing). Only stable releases
          # (main -> latest) go to the prod registry, which production loads from.
          REGISTRIES="https://registry.dev.vetra.io"
          if [ "$CHANNEL" = "latest" ]; then
            REGISTRIES="$REGISTRIES https://registry.vetra.io"
          fi
          PKG=$(node -p "require('./package.json').name")
          for reg in $REGISTRIES; do
            TOKEN=$(node scripts/ci/mint-renown-token.mjs "$reg")
            echo "::add-mask::$TOKEN"
            echo "//${reg#https://}/:_authToken=$TOKEN" > "$RUNNER_TEMP/.npmrc"
            WHO=$(curl -sf -H "Authorization: Bearer $TOKEN" "$reg/-/whoami" || true)
            case "$WHO" in
              *did:*) ;;
              *) echo "::error::Renown auth failed on $reg for $RENOWN_ADDRESS"; exit 1 ;;
            esac
            # A rerun must not fail on a version it already published.
            if npm view "$PKG@$VERSION" version --registry "$reg" --userconfig "$RUNNER_TEMP/.npmrc" >/dev/null 2>&1; then
              echo "$PKG@$VERSION already on $reg, skipping"
              continue
            fi
            npm publish "$TARBALL" --registry "$reg" --userconfig "$RUNNER_TEMP/.npmrc" \
              --access public --tag "$CHANNEL"
            echo "Published $PKG@$VERSION to $reg with tag $CHANNEL"
          done
          rm -f "$RUNNER_TEMP/.npmrc"

      - name: Create git tag
        if: needs.prepare.outputs.dry_run != 'true'
        run: |
          git tag "v${{ steps.version.outputs.new_version }}"
          git push origin "v${{ steps.version.outputs.new_version }}"

  # ==========================================================================
  # Build the studio-housekeeping activator image.
  #
  # The connect/switchboard/secrets-controller images are built elsewhere, but
  # the activator (housekeeping-service Dockerfile target) is owned by this repo
  # and needs an image for the ArgoCD app to deploy. Build + push on each
  # non-dry-run publish; the app's image-updater tracks the channel tag.
  # ==========================================================================
  build-housekeeping-image:
    name: Build housekeeping-service image
    needs: [prepare, publish]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Pull latest changes
        run: git pull origin ${{ needs.prepare.outputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine image tags
        id: tags
        run: |
          # Hardcode the "vetra" Harbor project (where the robot account has push
          # access and where the sibling secrets-controller image lives). The
          # default project_name = repo name = "vetra-cloud-package", a project
          # the robot can't push to (401). Must match the ArgoCD app's image ref.
          VERSION="${{ needs.publish.outputs.new_version }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          BASE="${{ env.DOCKER_REGISTRY }}/vetra/housekeeping-service"
          echo "tags=${BASE}:v${VERSION},${BASE}:${CHANNEL}" >> $GITHUB_OUTPUT
          echo "Image tags: ${BASE}:v${VERSION}, ${BASE}:${CHANNEL}"

      - name: Build and push housekeeping-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: housekeeping-service
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Build the secrets-controller image.
  #
  # Owned by this repo (root Dockerfile `secrets-controller` target) but, until
  # now, had no CI — the image was built and pushed by hand, so a controller
  # change only reached the cluster if someone remembered to run
  # `docker build --target secrets-controller`. Build + push on each
  # non-dry-run publish, exactly like the housekeeping-service image above; the
  # deployment tracks the channel tag (`:dev`).
  # ==========================================================================
  build-secrets-controller-image:
    name: Build secrets-controller image
    needs: [prepare, publish]
    if: needs.prepare.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.branch }}

      - name: Pull latest changes
        run: git pull origin ${{ needs.prepare.outputs.branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Determine image tags
        id: tags
        run: |
          # Hardcode the "vetra" Harbor project (where the robot account has push
          # access). The default project_name = repo name = "vetra-cloud-package",
          # a project the robot can't push to (401). Must match the ArgoCD app's
          # image ref (infrastructure/secrets-controller/base/deployment.yaml).
          VERSION="${{ needs.publish.outputs.new_version }}"
          CHANNEL="${{ needs.prepare.outputs.channel }}"
          BASE="${{ env.DOCKER_REGISTRY }}/vetra/secrets-controller"
          echo "tags=${BASE}:v${VERSION},${BASE}:${CHANNEL}" >> $GITHUB_OUTPUT
          echo "Image tags: ${BASE}:v${VERSION}, ${BASE}:${CHANNEL}"

      - name: Build and push secrets-controller
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: secrets-controller
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
