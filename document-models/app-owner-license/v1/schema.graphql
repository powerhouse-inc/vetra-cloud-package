type AppOwnerLicenseState {
  app: PHID
  licenseType: PHID
  user: EthereumAddress
  issuer: LicenseIssuerKind
  issuedBy: EthereumAddress
  stage: PHID
  details: String
  issued: DateTime
  start: DateTime
  end: DateTime
  status: LicenseStatus!
  replacedBy: PHID
  revokedReason: String
}

enum LicenseIssuerKind {
  INVITE_CODE
  PUBLISHER_GRANT
  ACHRA_SUBSCRIPTION
}

enum LicenseStatus {
  ISSUED
  ACTIVE
  EXPIRED
  REVOKED
  REPLACED
}

# lifecycle

input IssueLicenseInput {
  app: PHID!
  licenseType: PHID!
  user: EthereumAddress!
  issuer: LicenseIssuerKind!
  issuedBy: EthereumAddress!
  stage: PHID
  details: String
  issued: DateTime!
  start: DateTime!
  end: DateTime
}

input ActivateLicenseInput {
  _: Boolean
}

input ExpireLicenseInput {
  _: Boolean
}

input RevokeLicenseInput {
  reason: String
}

input ReplaceLicenseInput {
  replacedBy: PHID!
}