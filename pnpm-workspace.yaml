allowBuilds:
  '@apollo/protobufjs': true
  '@datadog/pprof': true
  '@parcel/watcher': true
  '@reown/appkit': false
  '@sentry/cli': true
  '@tailwindcss/oxide': true
  better-sqlite3: true
  bufferutil: true
  esbuild: true
  keccak: false
  msw: true
  protobufjs: true
  utf-8-validate: true

# pnpm 11 matches this on the package NAME only — a name@version entry
# (what `ph update` writes) is silently ignored and the release-age gate
# still rejects the install. First-party packages only; third-party deps
# keep the protection.
minimumReleaseAgeExclude:
  - '@powerhousedao/analytics-engine-browser'
  - '@powerhousedao/analytics-engine-core'
  - '@powerhousedao/analytics-engine-graphql'
  - '@powerhousedao/analytics-engine-knex'
  - '@powerhousedao/analytics-engine-pg'
  - '@powerhousedao/builder-tools'
  - '@powerhousedao/codegen'
  - '@powerhousedao/common'
  - '@powerhousedao/config'
  - '@powerhousedao/connect'
  - '@powerhousedao/design-system'
  - '@powerhousedao/opentelemetry-instrumentation-reactor'
  - '@powerhousedao/pglite-fs'
  - '@powerhousedao/ph-cli'
  - '@powerhousedao/powerhouse-vetra-packages'
  - '@powerhousedao/reactor-api'
  - '@powerhousedao/reactor-attachments'
  - '@powerhousedao/reactor-browser'
  - '@powerhousedao/reactor-drive'
  - '@powerhousedao/reactor-mcp'
  - '@powerhousedao/reactor'
  - '@powerhousedao/shared'
  - '@powerhousedao/switchboard'
  - '@powerhousedao/vetra'
  - '@renown/sdk'
  - 'document-model'
  - '@powerhousedao/reactor-group'

overrides:
  '@openfeature/core': ^1.9.2
  # Force a single graphql instance — codegen (graphql-tools) throws
  # "Cannot use GraphQLObjectType ... from another module or realm" when
  # multiple 16.x copies resolve. Matches the 6.2.0 migration pin.
  graphql: 16.13.2
