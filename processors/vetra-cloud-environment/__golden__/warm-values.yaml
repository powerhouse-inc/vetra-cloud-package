# managed-by: vetra-cloud-environment
global:
  disabled: false
  subdomain: "vast-vole-351c8164"
  wildcardTls: true
  imagePullSecrets:
    enabled: true
    name: harbor-credentials
    useExisting: true
database:
  cnpg:
    enabled: true
    name: vast-vole-351c8164-8tgxdfjj-pg
    instances: 1
    storageClass: longhorn-studio
    storageSize: 50Gi
    postgresql:
      maxConnections: "600"
      sharedBuffers: 512MB
      effectiveCacheSize: 2GB
      workMem: 32MB
    pooler:
      enabled: true
      instances: 1
      poolMode: transaction
      defaultPoolSize: 50
      maxClientConnections: 400
    backup:
      enabled: true
      destinationPath: s3://powerhouse-cnpg-backups/vast-vole-351c8164-8tgxdfjj/
      endpointURL: https://hel1.your-objectstorage.com
      credentialsSecret: s3-credentials
      retentionPolicy: 180d
      useExistingSecret: true
      scheduledBackup:
        enabled: true
        schedule: 0 2 * * *
        immediate: true
    resources:
      # Studio DBs are tiny reactor doc stores: measured p90 ~106m CPU / ~842Mi
      # mem. The old flat 2-core / 2Gi *request* over-reserved ~20-40x and was
      # the single biggest CPU reservation in the cluster (~60 cores across ~30
      # studio DBs vs ~1.5 cores actually used). Cut requests to a real-usage
      # floor; limits stay 8 cores / 8Gi so the DB still bursts freely under
      # event load — this reclaims the idle scheduling floor only, no OOM or
      # throttle risk. (Right-sized 2026-08-05; trimmed again 2026-08-11 to
      # 512Mi/100m after live steady-state measured median ~161Mi/40m, p90
      # ~178Mi over 34 DBs — 1Gi/250m was still ~5-6x over-reserved.)
      requests:
        memory: 512Mi
        cpu: "100m"
      limits:
        memory: 8Gi
        cpu: "8"
    bootstrap:
      database: vast_vole_351c8164_8tgxdfjj_db
      owner: vast_vole_351c8164_8tgxdfjj_user
switchboard:
  enabled: false
  gitops:
    enabled: false
  name: switchboard
  replicaCount: 1
  image:
    repository: cr.vetra.io/powerhouse-inc-powerhouse/switchboard
    tag: dev
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    targetPort: 3000
  ingress:
    enabled: true
    className: traefik
    host: "vast-vole-351c8164-switchboard.vetra.io"
    tls:
      enabled: true
      secretName: switchboard-vast-vole-351c8164-vetra-io-tls
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
  env:
    PORT: "3000"
    NODE_ENV: production
    NODE_OPTIONS: "--max-old-space-size=768"
    PH_REGISTRY_URL: "https://registry.vetra.io"
    PH_REGISTRY_PACKAGES: ""
    REACTOR_LEGACY_PROCESSOR_IDS: "false"
    OPENBAO_ADDR: https://openbao.vetra.io
  envConfigMap:
    TENANT_ID: vast-vole-351c8164-8tgxdfjj
    TENANT_NAME: "achra"
  envFrom:
    - configMapRef:
        name: vast-vole-351c8164-8tgxdfjj-env
        optional: true
    - secretRef:
        name: vast-vole-351c8164-8tgxdfjj-secrets
        optional: true
  # /health and /ready are registered ahead of auth, so these keep working with
  # REQUIRE_AUTHENTICATED_CALLER=true. "exec: null" clears the chart's default
  # exec probe: Helm merges maps, and a probe with two handler types is rejected.
  livenessProbe:
    enabled: true
    exec: null
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 120
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 6
  readinessProbe:
    enabled: true
    exec: null
    httpGet:
      path: /ready
      port: http
    initialDelaySeconds: 15
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 12
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    fsGroup: 0
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  autoscaling:
    enabled: false
